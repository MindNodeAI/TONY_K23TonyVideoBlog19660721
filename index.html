  <!-- API Key Modal -->

  <script type="module">
    /* --- STREAMING_CHUNK: 匯入 Firebase 核心模組 --- */
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getAuth, signInWithPopup, GoogleAuthProvider, signOut, onAuthStateChanged, signInWithEmailAndPassword, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
    import { getFirestore, doc, setDoc, collection, query, where, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

    /* --- STREAMING_CHUNK: 系統常數與狀態 --- */
    const SUPER_ADMIN_EMAIL = "mindnodeai@gmail.com";

    const firebaseConfig = {
      apiKey: "AIzaSyCcX3jKk0fACrbMNw1FLyj4VgRO7QUhypo",
      authDomain: "k23-tony-video-blog.firebaseapp.com",
      projectId: "k23-tony-video-blog",
      storageBucket: "k23-tony-video-blog.firebasestorage.app",
      messagingSenderId: "577648090163",
      appId: "1:577648090163:web:6d52a6cd367734155c5746"
    };

    const State = {
      user: null, isAdmin: false, isInitialAuthResolved: false,
      videos: [],
      aiKey: sessionStorage.getItem('gemini_api_key') || '',
      currentRoute: ''
    };

    // 精準設定規格書四大分類
    const SERIES_MAP = {
      'plant-timelapse': '植物花果生命縮時導演',
      'eco-documentary': '昆蟲兩棲生命蛻變導演',
      'life-cycle': '動物鳥類生命成長導演',
      'expert-talks': '海洋魚類生命導演'
    };

    const $ = (s) => document.querySelector(s);

    /* --- STREAMING_CHUNK: 實用工具庫 --- */
    const Utils = {
      showToast: (msg, type = 'info') => {
        const container = $('#toast-container');
        if(!container) return;
        const t = document.createElement('div');
        const colors = { success: 'bg-brand-green text-black', error: 'bg-red-500 text-white', info: 'bg-brand-blue text-white' };
        t.className = `flex items-center gap-3 ${colors[type]} px-5 py-3.5 rounded-xl shadow-2xl transform transition-all duration-300 translate-y-10 opacity-0 font-bold text-sm tracking-wide z-[9999]`;
        t.innerHTML = `<span>${msg}</span>`;
        container.appendChild(t);
        requestAnimationFrame(() => t.classList.remove('translate-y-10', 'opacity-0'));
        setTimeout(() => { t.classList.add('opacity-0', 'scale-95'); setTimeout(() => t.remove(), 300); }, 3500);
      },
      escapeHtml: (str) => (typeof str !== 'string' ? '' : str.replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' })[m])),
      extractYoutubeId: (url) => {
          const match = url.match(/^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=|\/shorts\/)([^#\&\?]*).*/);
          return (match && match[2].length === 11) ? match[2] : null;
      }
    };

    /* --- STREAMING_CHUNK: Firebase 初始化 --- */
    let app, auth, db;
    try {
      app = initializeApp(firebaseConfig);
      auth = getAuth(app);
      db = getFirestore(app); // 移除快取，避免沙盒權限報錯
    } catch(error) {
      console.error("Firebase Init Error:", error);
    }

    /* --- STREAMING_CHUNK: 資料讀取服務 (防呆降級) --- */
    let videosUnsubscribe = null;
    const DataService = {
      loadVideos: (forcePublicOnly = false) => {
        if (!db) return;
        if (videosUnsubscribe) videosUnsubscribe();
        
        // 防呆邏輯：若 forcePublicOnly 為 true，即使是管理員也假裝是一般訪客抓公開資料
        const isQueryingAdmin = State.isAdmin && !forcePublicOnly;
        const videosRef = collection(db, 'videos');
        
        // 嚴格遵守 Rules：非管理員只能請求 published
        const q = isQueryingAdmin 
            ? query(videosRef) 
            : query(videosRef, where("status", "==", "published"));
        
        videosUnsubscribe = onSnapshot(q, (snap) => {
          let vids = [];
          snap.forEach(doc => vids.push({ id: doc.id, ...doc.data() }));
          // 前端記憶體排序，徹底避開 Firebase Index 報錯
          vids.sort((a, b) => (b.createdAt?.seconds || 0) - (a.createdAt?.seconds || 0));
          State.videos = vids;
          
          if (['#/home', ''].includes(State.currentRoute)) Views.renderHome();
          else if (State.currentRoute === '#/explore') Views.renderExplore();
          else if (State.currentRoute === '#/admin' && State.isAdmin) Views.renderAdmin();
          
        }, err => {
            console.error("Firestore Error:", err);
            // 自動降級重試：如果是因為沒驗證信箱導致管理員抓不到全部，就降級抓已發布的
            if (err.code === 'permission-denied' && isQueryingAdmin) {
                console.warn("管理員權限遭拒，自動降級為一般模式讀取...");
                DataService.loadVideos(true);
            } else {
                Utils.showToast("讀取資料失敗，請確認資料庫連線", "error");
                // 即使失敗也要顯示首頁 (防白畫面)
                if (['#/home', ''].includes(State.currentRoute)) Views.renderHome();
            }
        });
      }
    };

    /* --- STREAMING_CHUNK: 身分驗證服務 --- */
    const AuthService = {
      init: () => {
        const m = $('#login-modal'), box = $('#login-box');
        const toggleLogin = (show) => {
          if(show) { m.classList.remove('hidden'); requestAnimationFrame(()=> { m.classList.remove('opacity-0'); box.classList.remove('scale-95'); }); }
          else { box.classList.add('scale-95'); m.classList.add('opacity-0'); setTimeout(()=>m.classList.add('hidden'), 200); }
        };
        
        $('#btn-login').onclick = () => toggleLogin(true);
        $('#btn-close-login').onclick = () => toggleLogin(false);
        
        $('#btn-google-login').onclick = async () => { 
            try { await signInWithPopup(auth, new GoogleAuthProvider()); toggleLogin(false); } 
            catch(e) { Utils.showToast('彈窗遭阻擋，請使用沙盒專用登入', 'error'); } 
        };
        
        $('#btn-email-login').onclick = async () => {
          const em = $('#input-login-email').value, pw = $('#input-login-pwd').value;
          if(!em||!pw) return Utils.showToast('請輸入帳密','error');
          try { await signInWithEmailAndPassword(auth, em, pw); toggleLogin(false); Utils.showToast('登入成功', 'success'); } 
          catch(e) { Utils.showToast(`登入失敗 (${e.code})`,'error'); }
        };
        
        $('#btn-anon-login').onclick = async () => { 
            try { await signInAnonymously(auth); toggleLogin(false); Utils.showToast('訪客登入成功', 'success'); } 
            catch(e) { Utils.showToast('訪客登入失敗','error'); } 
        };
        
        $('#btn-logout').onclick = () => { signOut(auth); Utils.showToast('已登出'); };

        onAuthStateChanged(auth, (user) => {
          State.user = user;
          if (user) {
            State.isAdmin = (user.email === SUPER_ADMIN_EMAIL);
            $('#btn-login').classList.add('hidden'); $('#user-profile-menu').classList.remove('hidden');
            $('#user-avatar').src = user.photoURL || 'https://placehold.co/100/0B1727/D7A84B?text=U';
            $('#user-name').innerText = user.displayName || (State.isAdmin ? '管理員' : '測試會員');
            $('#user-email').innerText = user.email || `ID: ${user.uid.slice(0,6)}...`;
            $('#link-admin').style.display = State.isAdmin ? 'flex' : 'none';
          } else {
            State.isAdmin = false;
            $('#btn-login').classList.remove('hidden'); $('#user-profile-menu').classList.add('hidden');
            if(State.currentRoute === '#/admin') Router.navigate('#/home');
          }
          
          if (!State.isInitialAuthResolved) {
             State.isInitialAuthResolved = true;
             Router.navigate(window.location.hash || '#/home');
          } else {
             DataService.loadVideos();
          }
        });
      }
    };

    /* --- STREAMING_CHUNK: 畫面渲染與播放器 --- */
    window.openVideo = (id) => {
       const v = State.videos.find(x => x.id === id);
       if(!v) return;
       const m = $('#video-modal');
       const box = $('#video-box');
       
       // 加入 origin 參數試圖減少 YouTube 沙盒阻擋
       const currentOrigin = window.location.origin !== 'null' ? window.location.origin : 'https://tony-video-blog.web.app';

        `;
        $('#app-view').innerHTML = html;

        let currentYtId = '';
        let isEditingMode = false;
        let editOriginalVersion = 1;

        const saveKey = (val) => { State.aiKey = val; sessionStorage.setItem('gemini_api_key', val); Utils.showToast('API Key 儲存成功', 'success'); };
        $('#btn-save-key-top').onclick = () => saveKey($('#input-ai-key').value.trim());

        // 1. 解析 YouTube (使用 noembed)
        $('#btn-fetch-yt').onclick = async () => {
            const url = $('#admin-url').value;
            currentYtId = Utils.extractYoutubeId(url);
            if(!currentYtId) return Utils.showToast('無效的 YouTube 網址', 'error');
            
            const existingVideo = State.videos.find(v => v.id === currentYtId);
            if (existingVideo) { window.editVideo(currentYtId); Utils.showToast('影片已存在，進入編輯模式', 'info'); return; }

            isEditingMode = false; editOriginalVersion = 1;
            $('#btn-quick-add').innerHTML = `<i class="ph-bold ph-check text-xl"></i> 3. 儲存新增`;
            $('#btn-cancel-edit').classList.add('hidden');
            $('#admin-form-title').innerHTML = `<i class="ph-fill ph-youtube-logo text-2xl text-red-500"></i> 新增影音館藏`;
            $('#draft-form').classList.remove('hidden');
            
            // 優先嘗試 maxresdefault (最高畫質)，若破圖則回退
            const thumbUrl = `https://img.youtube.com/vi/${currentYtId}/maxresdefault.jpg`;
            $('#draft-thumb').src = thumbUrl;
            $('#draft-thumb').onerror = () => { $('#draft-thumb').src = `https://img.youtube.com/vi/${currentYtId}/hqdefault.jpg`; };
            
            try {
                $('#btn-fetch-yt').innerHTML = `<i class="ph-bold ph-spinner animate-spin text-xl"></i>`;
                const res = await fetch(`https://noembed.com/embed?url=https://www.youtube.com/watch?v=${currentYtId}`);
                const data = await res.json();
                if(data.title) { $('#draft-title').value = data.title; Utils.showToast('標題擷取成功，請點擊 AI 產出', 'success'); }
            } catch(e) { console.warn('Noembed failed:', e); } 
            finally { $('#btn-fetch-yt').innerHTML = `<i class="ph-bold ph-link text-xl"></i> 1. 解析`; }
        };

        // 2. AI 產出 (需要 Key，結合標題)
        $('#btn-ai-gen').onclick = async () => {
            if(!currentYtId) return Utils.showToast('請先貼上網址並點擊解析', 'error');
            if(!State.aiKey) { $('#apiKey-modal').classList.remove('hidden'); requestAnimationFrame(()=>$('#apiKey-modal').classList.remove('opacity-0')); return; }
            
            const currentTitle = $('#draft-title').value || '';
            if(!currentTitle) return Utils.showToast('解析失敗，請先手動輸入標題給 AI 當作線索', 'error');

            const btn = $('#btn-ai-gen');
            btn.innerHTML = `<i class="ph-bold ph-spinner animate-spin text-xl"></i> 產出中...`;
            
            try {
                // 明確指定 gemini-3.7-flash
                const prompt = `你是自然生態教育專家。請根據影片標題「${currentTitle}」，用繁體中文撰寫一段約 80 字的高質感影片介紹。不要使用任何 Markdown 符號或 JSON 格式，直接回傳純文字內容。`;
                
                const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3.7-flash:generateContent?key=${State.aiKey}`, {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
                });
                
                const data = await res.json();
                if(data.error) throw new Error(data.error.message);
                const text = data.candidates[0].content.parts[0].text;
                
                $('#draft-desc').value = text.replace(/```/g, '').trim();
                Utils.showToast('AI 產出成功！', 'success');
            } catch (e) {
                Utils.showToast(`AI 產出失敗：${e.message}`, 'error');
            } finally {
                btn.innerHTML = `<i class="ph-fill ph-sparkle text-xl"></i> 2. AI 助理產出`;
            }
        };

        // 3. 儲存 (新增 / 更新)
        $('#btn-quick-add').onclick = async () => {
            if(!currentYtId) return Utils.showToast('請先解析 YouTube 網址', 'error');
            const title = $('#draft-title').value;
            if(!title) return Utils.showToast('影片標題不能為空', 'error');
            
            const btn = $('#btn-quick-add');
            btn.innerHTML = `<i class="ph-bold ph-spinner animate-spin text-xl"></i> 儲存中...`;
            
            try {
                const payload = {
                    youtubeId: currentYtId,
                    titleZh: title,
                    fullDescription: $('#draft-desc').value || '',
                    status: $('#draft-status').value, 
                    seriesId: $('#draft-series').value, 
                    thumbnailUrl: $('#draft-thumb').src, // 儲存正確的縮圖路徑
                    version: isEditingMode ? editOriginalVersion + 1 : 1, // 嚴格遵守 Rules 要求 version >= 1
                    updatedAt: serverTimestamp()
                };
                if (!isEditingMode) payload.createdAt = serverTimestamp();
                
                // 儲存至資料庫
                await setDoc(doc(db, 'videos', currentYtId), payload, { merge: true });
                Utils.showToast(`儲存成功！(狀態: ${payload.status})`, 'success');
                resetForm();
            } catch(e) {
                Utils.showToast(`寫入失敗：${e.message}`, 'error');
            } finally {
                btn.innerHTML = `<i class="ph-bold ph-check text-xl"></i> 3. 儲存`;
            }
        };

        const resetForm = () => {
            $('#admin-url').value = ''; $('#draft-title').value = ''; $('#draft-desc').value = '';
            $('#draft-series').value = 'plant-timelapse'; $('#draft-status').value = 'draft';
            $('#draft-form').classList.add('hidden'); $('#btn-cancel-edit').classList.add('hidden');
            $('#btn-quick-add').innerHTML = `<i class="ph-bold ph-check text-xl"></i> 3. 儲存`;
            $('#admin-form-title').innerHTML = `<i class="ph-fill ph-youtube-logo text-2xl text-red-500"></i> 新增影音館藏`;
            currentYtId = ''; isEditingMode = false;
        };

        $('#btn-cancel-edit').onclick = resetForm;

        // 全域編輯功能
        window.editVideo = (id) => {
            const v = State.videos.find(x => x.id === id);
            if(!v) return;
            
            currentYtId = v.id; isEditingMode = true; editOriginalVersion = v.version || 1;
            $('#admin-url').value = `https://youtu.be/${v.id}`;
            $('#draft-title').value = v.titleZh || '';
            $('#draft-desc').value = v.fullDescription || '';
            
            const seriesSelect = $('#draft-series');
            if(Array.from(seriesSelect.options).some(opt => opt.value === v.seriesId)) seriesSelect.value = v.seriesId;
            
            const statusSelect = $('#draft-status');
            if(Array.from(statusSelect.options).some(opt => opt.value === v.status)) statusSelect.value = v.status;

            $('#draft-thumb').src = v.thumbnailUrl || `https://img.youtube.com/vi/${v.id}/hqdefault.jpg`;
            $('#btn-quick-add').innerHTML = `<i class="ph-bold ph-check text-xl"></i> 3. 儲存變更`;
            $('#btn-cancel-edit').classList.remove('hidden');
            $('#admin-form-title').innerHTML = `<i class="ph-fill ph-pencil-simple text-2xl text-brand-gold"></i> 編輯影音資料`;
            
            $('#draft-form').classList.remove('hidden');
            $('#draft-form').scrollIntoView({ behavior: 'smooth', block: 'center' });
            Utils.showToast('已進入編輯模式', 'info');
        };
      }
    };

    /* --- STREAMING_CHUNK: 路由控制 --- */
    const Router = {
      navigate: (hash) => {
        if (!hash) hash = '#/home';
        State.currentRoute = hash;
        window.scrollTo({ top: 0, behavior: 'smooth' });
        
        // 關於頁面不依賴影片資料，可直接渲染
        if (hash === '#/about') {
            Views.renderAbout();
            return;
        }

        // 確認登入狀態已解析完畢，才去抓取資料
        if(State.isInitialAuthResolved) {
            DataService.loadVideos();
        }
      }
    };
    
    window.addEventListener('hashchange', () => Router.navigate(window.location.hash));

    /* --- STREAMING_CHUNK: Modal 與全域事件 --- */
    $('#btn-close-apiKey').onclick = () => { $('#apiKey-modal').classList.add('opacity-0'); setTimeout(()=>$('#apiKey-modal').classList.add('hidden'), 200); };
    $('#btn-save-apiKey').onclick = () => { 
        const val = $('#input-modal-apikey').value.trim();
        if(val) { State.aiKey = val; sessionStorage.setItem('gemini_api_key', val); $('#btn-close-apiKey').click(); Utils.showToast('Key 套用成功，請再次點擊產出', 'success'); }
    };

    /* --- STREAMING_CHUNK: 啟動應用程式 --- */
    window.addEventListener('DOMContentLoaded', () => {
        try {
            AuthService.init(); 
        } catch (error) {
            console.error("啟動失敗:", error);
            $('#app-view').innerHTML = `<div class="py-40 text-center text-red-500 font-bold">系統載入失敗，請重新整理頁面。</div>`;
        }
    });

  </script>
</body>
</html>
