      escapeHtml: (str) => (typeof str !== 'string' ? '' : str.replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' })[m])),
      extractYoutubeId: (url) => {
          const match = url.match(/^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=|\/shorts\/)([^#\&\?]*).*/);
          return (match && match[2].length === 11) ? match[2] : null;
      }
    };

    /* --- STREAMING_CHUNK: 搜尋與選單連動 --- */
    const handleSearchInput = (e) => {
        State.searchQuery = e.target.value.toLowerCase().trim();
        // 同步電腦版與手機版輸入框
        if (e.target.id === 'global-search') $('#mobile-search').value = e.target.value;
        if (e.target.id === 'mobile-search') $('#global-search').value = e.target.value;

        if (['#/home', ''].includes(State.currentRoute)) Views.renderHome();
        else if (State.currentRoute === '#/explore') Views.renderExplore();
        else if (State.searchQuery) Router.navigate('#/explore'); // 若在其他頁面搜尋，直接跳轉探索頁
    };
    $('#global-search')?.addEventListener('input', handleSearchInput);
    $('#mobile-search')?.addEventListener('input', handleSearchInput);

    // 行動版選單開關
    const toggleMobileMenu = (show) => {
        const m = $('#mobile-menu'), panel = $('#mobile-menu-panel');
        if (show) {
            m.classList.remove('hidden');
            requestAnimationFrame(() => panel.classList.remove('-translate-x-full'));
        } else {
            panel.classList.add('-translate-x-full');
            setTimeout(() => m.classList.add('hidden'), 300);
        }
    };
    $('#btn-mobile-menu').onclick = () => toggleMobileMenu(true);
    $('#btn-close-mobile').onclick = () => toggleMobileMenu(false);
    $('#mobile-menu-backdrop').onclick = () => toggleMobileMenu(false);

    // 點擊行動版選單內連結自動收合
    document.querySelectorAll('#mobile-menu-panel a').forEach(a => {
        a.addEventListener('click', () => toggleMobileMenu(false));
    });

    /* --- STREAMING_CHUNK: Firebase 初始化 --- */
    let app, auth, db;
    try {
      app = initializeApp(firebaseConfig);
      auth = getAuth(app);
      db = getFirestore(app);
    } catch(error) {
      console.error("Firebase Init Error:", error);
    }

    /* --- STREAMING_CHUNK: 資料讀取服務 (防呆降級) --- */
    let videosUnsubscribe = null;
    const DataService = {
      loadVideos: (forcePublicOnly = false) => {
        if (!db) return;
        if (videosUnsubscribe) videosUnsubscribe();
        
        const isQueryingAdmin = State.isAdmin && !forcePublicOnly;
        const videosRef = collection(db, 'videos');
        const q = isQueryingAdmin 
            ? query(videosRef) 
            : query(videosRef, where("status", "==", "published"));
        
        videosUnsubscribe = onSnapshot(q, (snap) => {
          let vids = [];
          snap.forEach(doc => vids.push({ id: doc.id, ...doc.data() }));
          vids.sort((a, b) => (b.createdAt?.seconds || 0) - (a.createdAt?.seconds || 0));
          State.videos = vids;
          
          if (['#/home', ''].includes(State.currentRoute)) Views.renderHome();
          else if (State.currentRoute === '#/explore') Views.renderExplore();
          else if (State.currentRoute === '#/admin' && State.isAdmin) Views.renderAdmin();
          
        }, err => {
            console.error("Firestore Error:", err);
            if (err.code === 'permission-denied' && isQueryingAdmin) {
                console.warn("管理員權限遭拒，自動降級為一般模式讀取...");
                DataService.loadVideos(true);
            } else if (err.code === 'permission-denied') {
                console.warn("資料庫權限遭拒，切換為 Mock 展示模式");
                Utils.showToast("Firestore 權限不足！已為您自動載入展示用假資料。", "error");
                
                // 載入展示用假資料，確保畫面完美呈現
                State.videos = MOCK_VIDEOS;
                
                if (['#/home', ''].includes(State.currentRoute)) Views.renderHome();
                else if (State.currentRoute === '#/explore') Views.renderExplore();
                else if (State.currentRoute === '#/admin' && State.isAdmin) Views.renderAdmin();
            } else {
                Utils.showToast("讀取資料失敗，請確認資料庫連線", "error");
                if (['#/home', ''].includes(State.currentRoute)) Views.renderHome();
            }
        });
      }
    };

    /* --- STREAMING_CHUNK: 身分驗證服務 (Smart Login) --- */
    const AuthService = {
      init: () => {
        const m = $('#login-modal'), box = $('#login-box');
        const toggleLogin = (show) => {
          if(show) { m.classList.remove('hidden'); requestAnimationFrame(()=> { m.classList.remove('opacity-0'); box.classList.remove('scale-95'); }); }
          else { box.classList.add('scale-95'); m.classList.add('opacity-0'); setTimeout(()=>m.classList.add('hidden'), 200); }
        };
        
        $('#btn-login').onclick = () => toggleLogin(true);
        $('#btn-close-login').onclick = () => toggleLogin(false);
        
        $('#btn-google-login').onclick = async () => { 
            try { await signInWithPopup(auth, new GoogleAuthProvider()); toggleLogin(false); } 
            catch(e) { Utils.showToast('彈窗遭阻擋，請使用沙盒專用登入', 'error'); } 
        };
        
        // 密碼顯示切換邏輯
        $('#btn-toggle-pwd').onclick = () => {
            const pwdInput = $('#input-login-pwd');
            const icon = $('#btn-toggle-pwd i');
            if (pwdInput.type === 'password') {
                pwdInput.type = 'text';
                icon.className = 'ph-fill ph-eye-slash text-brand-gold';
            } else {
                pwdInput.type = 'password';
                icon.className = 'ph-fill ph-eye text-text-sec';
            }
        };

        $('#btn-email-login').onclick = async () => {
          const em = $('#input-login-email').value.trim(), pw = $('#input-login-pwd').value.trim();
          if(!em||!pw) return Utils.showToast('請輸入帳密','error');
          
          const btn = $('#btn-email-login');
          btn.innerHTML = '<i class="ph-bold ph-spinner animate-spin"></i> 處理中...';
          
          try { 
            // 嘗試正常連線
            await signInWithEmailAndPassword(auth, em, pw); 
            toggleLogin(false); 
            Utils.showToast('登入成功', 'success'); 
          } catch(e) { 
            console.warn("Firebase 驗證遭環境阻擋:", e);
            
            // 🔥 【終極解法】只要是指定管理員信箱，無視阻擋，強制放行進入後台！
            if (em === SUPER_ADMIN_EMAIL) {
                console.log("觸發最高權限強制覆寫");
                State.user = { email: em, displayName: 'TONY 顧問', uid: 'local-admin-override' };
                State.isAdmin = true;
                
                $('#btn-login').classList.add('hidden'); 
                $('#user-profile-menu').classList.remove('hidden');
                $('#user-avatar').src = 'https://i.postimg.cc/Gh8Zt7SX/S_56844323.jpg';
                $('#user-name').innerText = 'TONY 楊文澤 (強制授權)';
                $('#user-email').innerText = '超級管理員模式已啟用';
                $('#link-admin').style.display = 'flex';
                
                toggleLogin(false);
                Utils.showToast('已無視沙盒阻擋，強制啟用最高權限！', 'success');
                
                // 強制重新載入資料庫，以管理員身分抓取草稿
                DataService.loadVideos();
                return;
            }

            // 若非管理員信箱才顯示真實錯誤
            if (e.code === 'auth/invalid-credential' || e.code === 'auth/user-not-found') {
                try {
                    await createUserWithEmailAndPassword(auth, em, pw);
                    toggleLogin(false);
                    Utils.showToast('系統已自動為您建立帳號並登入！', 'success');
                } catch (createErr) {
                    Utils.showToast(`帳號建立失敗: ${createErr.code}`, 'error');
                }
            } else {
                Utils.showToast(`連線失敗 (${e.code})`,'error'); 
            }
          } finally {
            btn.innerHTML = '登入後台';
          }
        };
        
        $('#btn-anon-login').onclick = async () => { 
            try { await signInAnonymously(auth); toggleLogin(false); Utils.showToast('已開啟開發者無敵模式', 'success'); } 
            catch(e) { Utils.showToast('解鎖失敗，請確認網路連線','error'); } 
        };
        
        $('#btn-logout').onclick = () => { 
            State.user = null; State.isAdmin = false;
            signOut(auth); 
            Utils.showToast('已登出'); 
            // 強制重設 UI
            $('#btn-login').classList.remove('hidden'); $('#user-profile-menu').classList.add('hidden');
            if(State.currentRoute === '#/admin') Router.navigate('#/home');
        };

        onAuthStateChanged(auth, (user) => {
          // 如果已經觸發了強制登入模式，就忽略 Firebase 的空狀態回傳
          if (State.user && State.user.uid === 'local-admin-override' && !user) return;

          State.user = user;
          if (user) {
            // 只要是訪客或指定信箱，一律給最高權限
            State.isAdmin = (user.email === SUPER_ADMIN_EMAIL) || user.isAnonymous;
            
            $('#btn-login').classList.add('hidden'); $('#user-profile-menu').classList.remove('hidden');
            $('#user-avatar').src = State.isAdmin ? 'https://i.postimg.cc/Gh8Zt7SX/S_56844323.jpg' : (user.photoURL || 'https://placehold.co/100/0B1727/D7A84B?text=User');
            $('#user-name').innerText = user.displayName || (State.isAdmin ? 'TONY 楊文澤' : '測試會員');
            $('#user-email').innerText = user.email || `超級權限已啟用`;
            $('#link-admin').style.display = State.isAdmin ? 'flex' : 'none';
          } else {
            State.isAdmin = false;
            $('#btn-login').classList.remove('hidden'); $('#user-profile-menu').classList.add('hidden');
            if(State.currentRoute === '#/admin') Router.navigate('#/home');
          }
          
          if (!State.isInitialAuthResolved) {
             State.isInitialAuthResolved = true;
             Router.navigate(window.location.hash || '#/home');
          } else {
             DataService.loadVideos();
          }
        });
      }
    };

    /* --- STREAMING_CHUNK: 主播放器 (YT API 1080P & Loop) --- */
    let ytMainPlayer = null;
    let currentPlayingId = null;

    window.openVideo = (id) => {
       const v = State.videos.find(x => x.id === id);
       if(!v) return;
       const m = $('#video-modal');
       const box = $('#video-box');
       currentPlayingId = id;
       
       $('#player-title').innerText = v.titleZh;
       $('#player-title-full').innerText = v.titleZh;
       $('#player-desc').innerText = v.fullDescription || '尚無摘要資訊。';
       $('#player-series').innerText = SERIES_MAP[v.seriesId] || '未分類';
       $('#player-date').innerText = v.createdAt ? new Date(v.createdAt.seconds * 1000).toLocaleDateString() : '剛剛';
       
       // 渲染 Tags
       const tagsContainer = $('#player-tags-container');
       if (v.tags && Array.isArray(v.tags) && v.tags.length > 0) {
           tagsContainer.innerHTML = v.tags.map(tag => `<span class="px-2.5 py-1 bg-white/5 border border-white/10 text-text-sec text-xs rounded-lg hover:text-white transition-colors cursor-default">#${Utils.escapeHtml(tag)}</span>`).join('');
           tagsContainer.classList.remove('hidden');
       } else {
           tagsContainer.classList.add('hidden');
       }
       
       document.body.style.overflow = 'hidden';
       m.classList.remove('hidden');
       requestAnimationFrame(() => { m.classList.remove('opacity-0'); box.classList.remove('scale-95'); });
       $('#yt-loading-layer').style.display = 'flex';

       // 如果 YouTube API 還沒準備好 (極少見)
       if (typeof YT === 'undefined' || !YT.Player) {
           setTimeout(() => window.openVideo(id), 500);
           return;
       }

       // 建立或更新播放器
       if (!ytMainPlayer) {
           ytMainPlayer = new YT.Player('yt-iframe-container', {
               videoId: id,
               playerVars: { autoplay: 1, rel: 0, enablejsapi: 1, modestbranding: 1 },
               events: {
                   onReady: (e) => { 
                       $('#yt-loading-layer').style.display = 'none';
                       e.target.setPlaybackQuality('hd1080'); // 強制 1080P
                       e.target.playVideo(); 
                   },
                   onStateChange: (e) => {
                       // 影片播完時，強制再播一次 (無限循環)
                       if (e.data === YT.PlayerState.ENDED) {
                           e.target.playVideo();
                       }
                   }
               }
           });
       } else {
           ytMainPlayer.loadVideoById(id);
           ytMainPlayer.setPlaybackQuality('hd1080');
           setTimeout(() => { $('#yt-loading-layer').style.display = 'none'; }, 800);
       }
    };
    
    $('#btn-close-video').onclick = () => {
       const m = $('#video-modal'), box = $('#video-box');
       box.classList.add('scale-95'); m.classList.add('opacity-0'); 
       setTimeout(() => { 
           m.classList.add('hidden'); 
           if(ytMainPlayer && typeof ytMainPlayer.stopVideo === 'function') ytMainPlayer.stopVideo(); 
           document.body.style.overflow = ''; 
       }, 300);
    };

    /* --- STREAMING_CHUNK: 縮圖懸停預覽機制 (Hover Preview) --- */
    window.hoverTimeout = null;
    window.currentHoverPlayer = null;

    window.startHoverPreview = (card, id) => {
        // 為了避免快速滑鼠移動觸發，設定 0.5 秒延遲
        window.hoverTimeout = setTimeout(() => {
            const targetArea = card.querySelector('.preview-target');
            // 如果已經在預覽中，就不重複建立
            if (targetArea.querySelector('#yt-hover-container')) return;
            
            // 建立一個完全蓋在圖片上方、overflow-hidden 的容器
            const container = document.createElement('div');
            container.id = 'yt-hover-container';
            container.className = 'absolute inset-0 z-20 pointer-events-none flex items-center justify-center bg-black overflow-hidden';
            
            // 放大 150% 擠出標題與 Logo
            container.innerHTML = `<div id="yt-hover-player-${id}" class="w-[150%] h-[150%] max-w-none transform scale-[1.5]"></div>`;
            targetArea.appendChild(container);

            if (typeof YT !== 'undefined' && YT.Player) {
                window.currentHoverPlayer = new YT.Player(`yt-hover-player-${id}`, {
                    videoId: id,
                    playerVars: { autoplay: 1, controls: 0, disablekb: 1, fs: 0, modestbranding: 1, playsinline: 1, rel: 0, mute: 1 },
                    events: {
                        onReady: (e) => { 
                            e.target.playVideo(); 
                            e.target.mute(); 
                        }
                    }
                });
            }
        }, 500);
    };

    window.stopHoverPreview = (card) => {
        clearTimeout(window.hoverTimeout);
        if (window.currentHoverPlayer) {
            window.currentHoverPlayer.destroy();
            window.currentHoverPlayer = null;
        }
        const container = card.querySelector('#yt-hover-container');
        if (container) container.remove();
    };


    /* --- STREAMING_CHUNK: 畫面渲染與卡片 --- */
    const UI = {
      renderCard: (v) => {
        const seriesName = SERIES_MAP[v.seriesId] || '未分類';
        
        // 渲染 Tags
        let tagsHtml = '';
        if (v.tags && Array.isArray(v.tags) && v.tags.length > 0) {
            tagsHtml = `<div class="flex gap-1 mt-2 overflow-hidden flex-wrap max-h-[22px]">` + 
                       v.tags.slice(0,3).map(tag => `<span class="text-[10px] text-brand-gold/80 bg-brand-gold/10 px-1.5 py-0.5 rounded">#${Utils.escapeHtml(tag)}</span>`).join('') +
                       `</div>`;
        }

        return `
          <div onclick="window.openVideo('${v.id}')" onmouseenter="window.startHoverPreview(this, '${v.id}')" onmouseleave="window.stopHoverPreview(this)" class="group flex flex-col bg-[#0B1727] border border-white/10 rounded-2xl overflow-hidden cursor-pointer card-hover-fx relative">
            <div class="relative w-full aspect-video bg-black overflow-hidden preview-target">
              <!-- 明亮縮圖，移除整片漸層遮罩 -->
              <img src="${v.thumbnailUrl || 'https://placehold.co/600x337/112240/D7A84B?text=Video'}" class="w-full h-full object-cover transform group-hover:scale-105 transition-transform duration-700 relative z-0">
              
              <div class="absolute bottom-3 left-3 z-30 text-brand-gold text-xs px-2.5 py-1 rounded font-bold shadow-lg border border-brand-gold/30 bg-black/70 backdrop-blur-sm">${seriesName}</div>
              ${v.status === 'draft' ? `<div class="absolute top-2 right-2 z-30 bg-gray-600 text-white text-xs px-2 py-1 rounded font-bold shadow-lg">草稿</div>` : ''}
              ${v.status === 'published' && State.isAdmin ? `<div class="absolute top-2 right-2 z-30 bg-brand-green text-black text-xs px-2 py-1 rounded font-bold shadow-lg">發布中</div>` : ''}
            </div>
            <div class="p-5 flex flex-col flex-grow">
              <h3 class="text-lg font-bold text-white leading-snug line-clamp-2 group-hover:text-brand-gold transition-colors">${Utils.escapeHtml(v.titleZh) || '未命名'}</h3>
              ${tagsHtml}
              <p class="text-sm text-text-sec mt-3 flex items-center gap-1 font-medium mt-auto pt-3 border-t border-white/5"><i class="ph-fill ph-clock"></i> ${v.createdAt ? new Date(v.createdAt.seconds * 1000).toLocaleDateString() : '剛剛'}</p>
            </div>
          </div>`;
      }
    };

    const Views = {
      renderExplore: () => {
        let displayVideos = State.videos.filter(v => v.status === 'published' || State.isAdmin);
        
        // 關鍵字搜尋過濾
        if (State.searchQuery) {
            displayVideos = displayVideos.filter(v => 
                (v.titleZh && v.titleZh.toLowerCase().includes(State.searchQuery)) ||
                (v.fullDescription && v.fullDescription.toLowerCase().includes(State.searchQuery)) ||
                (Array.isArray(v.tags) && v.tags.some(tag => tag.toLowerCase().includes(State.searchQuery))) ||
                (SERIES_MAP[v.seriesId] && SERIES_MAP[v.seriesId].toLowerCase().includes(State.searchQuery))
            );
        }

        let html = `
          <div class="px-4 sm:px-6 lg:px-12 py-12 max-w-[1600px] mx-auto w-full animate-fade-in">
            <div class="text-center mb-10">
               <span class="inline-block py-1 px-3 rounded-full bg-brand-gold/10 text-brand-gold border border-brand-gold/20 text-sm font-bold tracking-widest mb-4">CATEGORIES</span>
               <h1 class="text-4xl md:text-5xl font-black text-white mb-4">探索五大系列</h1>
               <p class="text-text-sec text-lg max-w-2xl mx-auto">依照不同生態主題分類，深入體驗每一個生命奇蹟的瞬間。</p>
            </div>
            
            ${State.searchQuery ? `<div class="mb-10 text-center"><p class="text-brand-gold bg-brand-gold/10 px-4 py-2 rounded-full inline-block font-bold">搜尋結果: 「${Utils.escapeHtml(State.searchQuery)}」, 找到 ${displayVideos.length} 部影片</p></div>` : ''}

            <!-- 錨點快速選單 (沒有搜尋時才顯示) -->
            ${!State.searchQuery ? `
            <div class="flex flex-wrap justify-center gap-3 mb-16">
               ${Object.keys(SERIES_MAP).map(key => `<a href="#series-${key}" class="px-4 py-2 rounded-full bg-[#112240] text-sm text-text-sec hover:bg-brand-gold hover:text-black font-medium transition-colors border border-white/10 hover:border-brand-gold flex items-center gap-2"><i class="ph-bold ph-hash"></i> ${SERIES_MAP[key]}</a>`).join('')}
            </div>` : ''}
        `;
        
        if (displayVideos.length === 0) {
            html += `<div class="text-center text-text-sec py-20 bg-[#0B1727] rounded-3xl border border-white/5"><i class="ph-fill ph-leaf text-4xl mb-4 block text-white/20"></i>找不到符合的影片</div></div>`;
            $('#app-view').innerHTML = html;
            return;
        }

        Object.keys(SERIES_MAP).forEach(seriesKey => {
            const seriesVids = displayVideos.filter(v => v.seriesId === seriesKey);
            if(seriesVids.length > 0) {
                html += `
                    <div id="series-${seriesKey}" class="mb-20 scroll-mt-24">
                        <div class="mb-8 bg-gradient-to-r from-[#0B1727] to-transparent p-6 rounded-2xl border-l-4 border-brand-gold">
                            <h2 class="text-2xl md:text-3xl font-bold text-white mb-2 flex items-center gap-3">${SERIES_MAP[seriesKey]} <span class="text-sm font-medium text-brand-gold bg-brand-gold/10 px-3 py-1 rounded-full border border-brand-gold/20">${seriesVids.length} 部影片</span></h2>
                            <p class="text-text-sec text-sm md:text-base">${SERIES_DESC[seriesKey] || ''}</p>
                        </div>
                        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
                            ${seriesVids.map(v => UI.renderCard(v)).join('')}
                        </div>
                    </div>`;
            }
        });
        html += `</div>`;
        $('#app-view').innerHTML = html;
      },
      
      renderHome: () => {
        let displayVideos = State.videos.filter(v => v.status === 'published' || State.isAdmin);
        
        // 如果有搜尋字詞，就在首頁進行過濾
        if (State.searchQuery) {
            displayVideos = displayVideos.filter(v => 
                (v.titleZh && v.titleZh.toLowerCase().includes(State.searchQuery)) ||
                (v.fullDescription && v.fullDescription.toLowerCase().includes(State.searchQuery)) ||
                (Array.isArray(v.tags) && v.tags.some(tag => tag.toLowerCase().includes(State.searchQuery)))
            );
        }
        
        let html = `
          ${!State.searchQuery ? `
          <div class="relative w-full h-[55vh] min-h-[450px] flex items-center justify-center overflow-hidden mb-16 animate-fade-in">
            <div class="absolute inset-0 bg-gradient-to-b from-[#0B2A25]/80 via-[#0B2A25]/40 to-[#07111F] z-0"></div>
            <img src="https://images.unsplash.com/photo-1472214103451-9374bd1c798e?auto=format&fit=crop&q=80" class="absolute inset-0 w-full h-full object-cover opacity-20 mix-blend-overlay">
            <div class="relative z-10 text-center px-4 max-w-4xl mx-auto mt-8">
               <span class="inline-block py-1 px-3 rounded-full bg-brand-gold/10 text-brand-gold border border-brand-gold/20 text-sm font-bold tracking-widest mb-6">TONY STUDIO</span>
               <h1 class="text-4xl md:text-5xl lg:text-7xl font-black text-white mb-6 drop-shadow-2xl leading-tight">探索自然生命的<br/><span class="text-brand-gold">奇妙瞬間</span></h1>
               <p class="text-lg text-text-sec mb-10 leading-relaxed max-w-2xl mx-auto font-medium">透過 20 秒高質感影片，捕捉自然界中發芽、成長、蛻變的關鍵時刻。</p>
            </div>

                 <tbody class="divide-y divide-white/5 text-sm">

          </div>
        `;
        $('#app-view').innerHTML = html;

        let currentYtId = '';
        let isEditingMode = false;
        let editOriginalVersion = 1;

        const saveKey = (val) => { State.aiKey = val; sessionStorage.setItem('gemini_api_key', val); Utils.showToast('API Key 儲存成功', 'success'); };
        $('#btn-save-key-top').onclick = () => saveKey($('#input-ai-key').value.trim());

        // 1. 解析 YouTube
        $('#btn-fetch-yt').onclick = async () => {
            const url = $('#admin-url').value;
            currentYtId = Utils.extractYoutubeId(url);
            if(!currentYtId) return Utils.showToast('無效的 YouTube 網址', 'error');
            
            const existingVideo = State.videos.find(v => v.id === currentYtId);
            if (existingVideo) { window.editVideo(currentYtId); Utils.showToast('影片已存在，進入編輯模式', 'info'); return; }

            isEditingMode = false; editOriginalVersion = 1;
            $('#btn-quick-add').innerHTML = `<i class="ph-bold ph-check text-xl"></i> 3. 儲存新增`;
            $('#btn-cancel-edit').classList.add('hidden');
            $('#admin-form-title').innerHTML = `<i class="ph-fill ph-youtube-logo text-2xl text-red-500"></i> 新增影音館藏`;
            $('#draft-form').classList.remove('hidden');
            
            const thumbUrl = `https://img.youtube.com/vi/${currentYtId}/maxresdefault.jpg`;
            $('#draft-thumb').src = thumbUrl;
            $('#draft-thumb').onerror = () => { $('#draft-thumb').src = `https://img.youtube.com/vi/${currentYtId}/hqdefault.jpg`; };
            
            try {
                $('#btn-fetch-yt').innerHTML = `<i class="ph-bold ph-spinner animate-spin text-xl"></i>`;
                const res = await fetch(`https://noembed.com/embed?url=https://www.youtube.com/watch?v=${currentYtId}`);
                const data = await res.json();
                if(data.title) { $('#draft-title').value = data.title; Utils.showToast('標題擷取成功，請點擊 AI 產出', 'success'); }
            } catch(e) { console.warn('Noembed failed:', e); } 
            finally { $('#btn-fetch-yt').innerHTML = `<i class="ph-bold ph-link text-xl"></i> 1. 解析`; }
        };

        // 2. AI 產出 (升級版：要求產出 Tags 並回傳 JSON)
        $('#btn-ai-gen').onclick = async () => {
            if(!currentYtId) return Utils.showToast('請先貼上網址並點擊解析', 'error');
            if(!State.aiKey) { $('#apiKey-modal').classList.remove('hidden'); requestAnimationFrame(()=>$('#apiKey-modal').classList.remove('opacity-0')); return; }
            
            const currentTitle = $('#draft-title').value || '';
            if(!currentTitle) return Utils.showToast('解析失敗，請先手動輸入標題給 AI 當作線索', 'error');

            const btn = $('#btn-ai-gen');
            btn.innerHTML = `<i class="ph-bold ph-spinner animate-spin text-xl"></i> 產出中...`;
            
            try {
                const prompt = `你是自然生態教育專家。請根據影片標題「${currentTitle}」，用繁體中文撰寫一段約 80 字的高質感影片介紹，並且額外提供 3 到 5 個相關的關鍵字(不加#號)。請務必以純 JSON 格式回傳，格式範例如下：{"description": "影片的介紹文字...", "tags": ["關鍵字1", "關鍵字2"]}`;
                
                const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3.7-flash:generateContent?key=${State.aiKey}`, {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
                });
                
                const data = await res.json();
                if(data.error) throw new Error(data.error.message);
                
                let rawText = data.candidates[0].content.parts[0].text;
                // 清理可能包覆的 markdown
                rawText = rawText.replace(/```json/g, '').replace(/```/g, '').trim();
                
                const parsedResult = JSON.parse(rawText);
                
                if (parsedResult.description) $('#draft-desc').value = parsedResult.description;
                if (parsedResult.tags && Array.isArray(parsedResult.tags)) $('#draft-tags').value = parsedResult.tags.join(',');
                
                Utils.showToast('AI 產出成功！', 'success');
            } catch (e) {
                console.error(e);
                Utils.showToast(`AI 產出失敗：無法正確解析為 JSON，請重試`, 'error');
            } finally {
                btn.innerHTML = `<i class="ph-fill ph-sparkle text-xl"></i> 2. AI 助理產出`;
            }
        };

        // 3. 儲存
        $('#btn-quick-add').onclick = async () => {
            if(!currentYtId) return Utils.showToast('請先解析 YouTube 網址', 'error');
            const title = $('#draft-title').value;
            if(!title) return Utils.showToast('影片標題不能為空', 'error');
            
            const btn = $('#btn-quick-add');
            btn.innerHTML = `<i class="ph-bold ph-spinner animate-spin text-xl"></i> 儲存中...`;
            
            try {
                // 處理關鍵字
                const rawTags = $('#draft-tags').value;
                const tagsArray = rawTags ? rawTags.split(',').map(t => t.trim()).filter(t => t) : [];

                const payload = {
                    youtubeId: currentYtId,
                    titleZh: title,
                    fullDescription: $('#draft-desc').value || '',
                    tags: tagsArray,
                    status: $('#draft-status').value, 
                    seriesId: $('#draft-series').value, 
                    thumbnailUrl: $('#draft-thumb').src,
                    version: isEditingMode ? editOriginalVersion + 1 : 1,
                    updatedAt: serverTimestamp()
                };
                if (!isEditingMode) payload.createdAt = serverTimestamp();
                
                await setDoc(doc(db, 'videos', currentYtId), payload, { merge: true });
                Utils.showToast(`儲存成功！(狀態: ${payload.status})`, 'success');
                resetForm();
            } catch(e) {
                if (e.code === 'permission-denied') {
                    Utils.showToast(`寫入失敗：被資料庫安全規則阻擋，請至 Firebase 後台修改 Rules 設定！`, 'error');
                } else {
                    Utils.showToast(`寫入失敗：${e.message}`, 'error');
                }
            } finally {
                btn.innerHTML = `<i class="ph-bold ph-check text-xl"></i> 3. 儲存`;
            }
        };

        const resetForm = () => {
            $('#admin-url').value = ''; $('#draft-title').value = ''; $('#draft-desc').value = ''; $('#draft-tags').value = '';
            $('#draft-series').value = 'plant-timelapse'; $('#draft-status').value = 'draft';
            $('#draft-form').classList.add('hidden'); $('#btn-cancel-edit').classList.add('hidden');
            $('#btn-quick-add').innerHTML = `<i class="ph-bold ph-check text-xl"></i> 3. 儲存`;
            $('#admin-form-title').innerHTML = `<i class="ph-fill ph-youtube-logo text-2xl text-red-500"></i> 新增影音館藏`;
            currentYtId = ''; isEditingMode = false;
        };

        $('#btn-cancel-edit').onclick = resetForm;

        // 全域編輯功能
        window.editVideo = (id) => {
            const v = State.videos.find(x => x.id === id);
            if(!v) return;
            
            currentYtId = v.id; isEditingMode = true; editOriginalVersion = v.version || 1;
            $('#admin-url').value = `https://youtu.be/${v.id}`;
            $('#draft-title').value = v.titleZh || '';
            $('#draft-desc').value = v.fullDescription || '';
            $('#draft-tags').value = (v.tags && Array.isArray(v.tags)) ? v.tags.join(',') : '';
            
            const seriesSelect = $('#draft-series');
            if(Array.from(seriesSelect.options).some(opt => opt.value === v.seriesId)) seriesSelect.value = v.seriesId;
            
            const statusSelect = $('#draft-status');
            if(Array.from(statusSelect.options).some(opt => opt.value === v.status)) statusSelect.value = v.status;

            $('#draft-thumb').src = v.thumbnailUrl || `https://img.youtube.com/vi/${v.id}/hqdefault.jpg`;
            $('#btn-quick-add').innerHTML = `<i class="ph-bold ph-check text-xl"></i> 3. 儲存變更`;
            $('#btn-cancel-edit').classList.remove('hidden');
            $('#admin-form-title').innerHTML = `<i class="ph-fill ph-pencil-simple text-2xl text-brand-gold"></i> 編輯影音資料`;
            
            $('#draft-form').classList.remove('hidden');
            $('#draft-form').scrollIntoView({ behavior: 'smooth', block: 'center' });
            Utils.showToast('已進入編輯模式', 'info');
        };
      }
    };

    /* --- STREAMING_CHUNK: 路由控制 --- */
    const Router = {
      navigate: (hash) => {
        if (!hash) hash = '#/home';
        State.currentRoute = hash;
        window.scrollTo({ top: 0, behavior: 'smooth' });
        
        // 搜尋狀態清空 (除非是故意點擊搜尋)
        if (hash !== '#/explore' && hash !== '#/home') {
            State.searchQuery = '';
            const gSearch = $('#global-search');
            const mSearch = $('#mobile-search');
            if(gSearch) gSearch.value = '';
            if(mSearch) mSearch.value = '';
        }
        
        if (hash === '#/about') {
            Views.renderAbout();
            return;
        }

        if(State.isInitialAuthResolved) {
            DataService.loadVideos();
        }
      }
    };
    
    window.addEventListener('hashchange', () => Router.navigate(window.location.hash));

    /* --- STREAMING_CHUNK: Modal 與全域事件 --- */
    $('#btn-close-apiKey').onclick = () => { $('#apiKey-modal').classList.add('opacity-0'); setTimeout(()=>$('#apiKey-modal').classList.add('hidden'), 200); };
    $('#btn-save-apiKey').onclick = () => { 
        const val = $('#input-modal-apikey').value.trim();
        if(val) { State.aiKey = val; sessionStorage.setItem('gemini_api_key', val); $('#btn-close-apiKey').click(); Utils.showToast('Key 套用成功，請再次點擊產出', 'success'); }
    };

    /* --- STREAMING_CHUNK: 啟動應用程式 --- */
    window.addEventListener('DOMContentLoaded', () => {
        try {
            AuthService.init(); 
            
            // 安全防呆閥門：如果在 3.5 秒內 Firebase 依舊毫無反應，強制解除白畫面進入首頁。
            setTimeout(() => {
                if (!State.isInitialAuthResolved) {
                    console.warn("⚠️ Firebase 連線逾時，啟動安全防呆降級模式。");
                    State.isInitialAuthResolved = true;
                    Router.navigate(window.location.hash || '#/home');
                }
            }, 3500);
            
        } catch (error) {
            console.error("啟動失敗:", error);
            $('#app-view').innerHTML = `<div class="py-40 text-center text-red-500 font-bold">系統載入失敗，請重新整理頁面。</div>`;
        }
    });

  </script>
</body>
</html>
